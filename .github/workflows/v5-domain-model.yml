name: V5 Domain Model

on:
  pull_request:
    paths:
      - "ontology_domain/**"
      - "tests/test_ontology_domain_models.py"
      - "tests/test_ontology_instance_lineage.py"
      - "tests/test_ontology_mapping_engine.py"
      - ".github/workflows/v5-domain-model.yml"
  push:
    branches: [main]
    paths:
      - "ontology_domain/**"
      - "tests/test_ontology_domain_models.py"
      - ".github/workflows/v5-domain-model.yml"

jobs:
  domain-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile domain package
        run: python -m compileall -q ontology_domain
      - name: Run domain and instance lineage tests
        run: |
          python -m unittest discover -s tests -p "test_ontology_domain_models.py" -v
          python -m unittest discover -s tests -p "test_ontology_instance_lineage.py" -v
          python -m unittest discover -s tests -p "test_ontology_mapping_engine.py" -v
