name: ontology-query-pipeline
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install networkx
      - name: Compile application and query pipeline
        run: python -m py_compile ontology_studio_v3.py ontology_query_pipeline.py
      - name: Run deterministic query pipeline tests
        run: python -m unittest discover -s tests -v
